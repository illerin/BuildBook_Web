events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 50M;

    server {
        listen 8080;
        root /app/public;
        index index.html;

        # API proxy
        location /api/ {
            proxy_pass http://localhost:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploaded files
        location /files/ {
            proxy_pass http://localhost:3001/files/;
        }

        # Fingerprinted React assets should be served only if they exist. This
        # avoids a stale browser asking for an old JS file and receiving
        # index.html, which appears as "Unexpected token '<'" in the console.
        location /static/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # React SPA - all other routes
        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}
